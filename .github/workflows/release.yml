name: Release

# Publishes the three packages to npm on a version tag (e.g. v2.0.0).
#
# Auth: the NPM_TOKEN Actions secret — a granular automation token scoped to the
# @volter packages with write access. It is NEVER committed; it lives only in
# GitHub's encrypted secret store, so making the repo public does not expose it.
# Rotate it any time on npmjs.com + re-set the secret.
#
# Publish order matters: core → client → mcp. `bun publish` rewrites the root
# `@volter/tunnel` package's `workspace:*` dependency on @volter/tunnel-core to
# the real published version.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Publish @volter/tunnel-core
        run: cd packages/core && bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @volter/tunnel
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @volter/tunnel-mcp
        run: cd packages/mcp && bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
