name: Deploy relay

# Deploys the Cloudflare Worker relay (server-cf/) to production.
#
# Gated to the `production` GitHub Environment, which has a required reviewer —
# so every prod deploy waits for a human to approve before any secret is used.
# Triggered by a `relay-v*` tag or a manual run (workflow_dispatch).
#
# Secrets (stored as Actions secrets, NEVER committed — making the repo public
# does not expose them):
#   CLOUDFLARE_API_TOKEN  — scope: Account → Workers Scripts: Edit (least privilege)
#   CLOUDFLARE_ACCOUNT_ID — the target account id
#
# The relay test suite (real workerd) runs first, so a deploy can't ship red.

on:
  push:
    tags:
      - 'relay-v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server-cf
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Test (real workerd)
        run: bun run test
      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
