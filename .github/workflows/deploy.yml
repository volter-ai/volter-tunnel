name: Deploy relay

# Deploys the Cloudflare Worker relay (server-cf/) to production.
#
# Gated to the `production` GitHub Environment, which has a required reviewer —
# so every prod deploy waits for a human to approve before any secret is used.
# Triggered by a `relay-v*` tag or a manual run (workflow_dispatch).
#
# Secrets (stored as Actions secrets, NEVER committed — making the repo public
# does not expose them):
#   CLOUDFLARE_API_TOKEN  — Edit-Workers token scoped to this account + zone
#   CLOUDFLARE_ACCOUNT_ID — the target account id
#
# Setup mirrors ci.yml's relay job: the root install provides jsonwebtoken (a
# root devDep the CF tests import), then the relay's own deps, then the real
# workerd suite runs before wrangler deploy — so a deploy can't ship red.

on:
  push:
    tags:
      - 'relay-v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The relay signs its people's tunnel tokens and carries their traffic, so a lockfile changed since the last
      # deploy is scanned before anything installs, and a finding stops the deploy (company decision 0038).
      - name: Release scan
        run: node .github/release-scan.mjs bun.lock server-cf/bun.lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SCAN_WORKFLOW: deploy.yml
      - name: Install root deps (provides jsonwebtoken for the CF tests)
        run: bun install --frozen-lockfile
      - name: Install relay deps
        run: cd server-cf && bun install --frozen-lockfile
      - name: Test (real workerd)
        run: cd server-cf && node scripts/brand-tokens.mjs && bunx vitest run
      - name: Deploy
        run: cd server-cf && bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
