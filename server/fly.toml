app = 'mc-tunnel'
primary_region = 'ewr'

[build]

[env]
  PORT = '8080'
  TUNNEL_DOMAIN = 'vgit-tunnels.volterapp.com'
  TUNNEL_SECURE = 'true'
  EXTERNAL_PORT = '443'
  # Origins granted credentialed CORS and cookie-authenticated WebSocket upgrades (server.mjs setCorsHeaders): pages
  # that call tunnels with the __volter_auth cookie. termfleet's cloud console (its Finder's fetchHostInfo); the
  # minimal-claude frontend, served by its gateways (prod, dev), which bootstraps the cookie and opens upgrades.
  CORS_CREDENTIALED_ORIGINS = 'https://termfleet-registry.chris-5ed.workers.dev,https://volter-gateway.fly.dev,https://minimal-claude-gateway.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
