app = 'mc-tunnel'
primary_region = 'ewr'

[build]

[env]
  PORT = '8080'
  TUNNEL_DOMAIN = 'vgit-tunnels.volterapp.com'
  TUNNEL_SECURE = 'true'
  EXTERNAL_PORT = '443'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
